<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000080">
<title>Fichero95</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000080'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23c0c0c0'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  /* Misma paleta que la app de escritorio */
  --face:#c0c0c0; --light:#ffffff; --shadow:#808080; --dark:#000000; --field:#ffffff;
  --alt:#ece9e0; --grid:#8c8c8c; --panel:#e2e0d6; --navy:#000080;
  --text:#000000; --muted:#404040; --hover:#d4d0c8; --press:#b0b0b0;
  --raised:#ffffff #000000 #000000 #ffffff;   /* arriba derecha abajo izquierda */
  --sunken:#808080 #ffffff #ffffff #808080;
  --pressed:#000000 #ffffff #ffffff #000000;
  --fs:16;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--face);color:var(--text);
  font:14px/1.4 Tahoma,"MS Sans Serif","DejaVu Sans",system-ui,sans-serif;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit}
[hidden]{display:none !important}
input[type=checkbox]{accent-color:var(--navy)}

/* Controles con relieve 3D */
button,select,input[type=search],input[type=password]{font:inherit;color:var(--text);border-radius:0}
button{cursor:pointer;background:var(--face);border:2px solid;border-color:var(--raised);padding:3px 10px;min-height:28px}
button:hover{background:var(--hover)}
button:active,.seg.on,.chip.on{border-color:var(--pressed);background:var(--press)}
button:disabled{color:var(--shadow)}
select,input[type=search],input[type=password]{width:100%;background:var(--field);border:2px solid;
  border-color:var(--sunken);padding:4px 6px;min-height:30px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#000 50%),linear-gradient(135deg,#000 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}

#app{display:flex;min-height:100%}
#side{width:100%;background:var(--face);display:flex;flex-direction:column}
#main{flex:1;min-width:0;display:none;background:var(--face)}
body.reading #side{display:none}
body.reading #main{display:block}

/* Barra de título azul, como una ventana de Windows 95 */
.side-head{display:flex;align-items:center;gap:8px;color:#fff;
  padding:calc(4px + env(safe-area-inset-top)) 6px 4px 8px;background:linear-gradient(90deg,#000080,#1084d0)}
.side-head h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.3px}
.side-head .sub{color:#dbe6ff;font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-head button{min-height:22px;padding:0 8px;line-height:1.2}

.filters{padding:8px;display:grid;gap:6px;background:var(--face);border-bottom:1px solid var(--shadow);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
details.tagbox{background:var(--face);border:2px solid;border-color:var(--sunken);padding:0 8px}
details.tagbox summary{padding:6px 0;cursor:pointer;user-select:none}
.tagmode{display:flex;gap:6px;margin:2px 0 8px;font-size:13px;align-items:center}
.seg{padding:1px 8px;min-height:24px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px}
.chip{border:2px solid;border-color:var(--raised);padding:2px 8px;font-size:13px;font-weight:700;min-height:0}
.chip small{opacity:.7;font-weight:400}
.chip:hover{filter:brightness(.95)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}

/* Lista de temas: tabla hundida con filas alternadas y selección azul marino */
#list{list-style:none;margin:6px 8px 12px;padding:0;background:var(--field);border:2px solid;border-color:var(--sunken)}
#list li{border-bottom:1px solid var(--grid)}
#list li:last-child{border-bottom:0}
#list li:nth-child(even) .item{background:var(--alt)}
#list li.none{padding:24px 14px;color:var(--muted);text-align:center;border:0;background:var(--field)}
.item{display:flex;align-items:center;gap:10px;padding:8px 8px;text-decoration:none;color:var(--text)}
.item:hover{filter:brightness(.96)}
.item.on{background:var(--navy) !important;color:#fff !important;filter:none}
.it-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.it-title{overflow-wrap:anywhere}
.it-title.star{font-weight:700}
.it-meta{font-size:12px;opacity:.8;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pill{display:inline-block;padding:1px 7px;font-size:12px;font-weight:700;line-height:1.5;border-radius:0}
.pill.none{background:#d6d6d6;color:#505050}
.mk{flex:none;width:14px;height:14px;border:1.5px solid #202020;background:#808080}
.mk.circle{border-radius:50%}
.mk.nocolor{background:transparent;border-color:transparent}
.pin{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2a3f9e;margin-left:6px;vertical-align:middle;border:1px solid #202020}
.pin.p2{background:#c0392b}
.starmark{color:#e0a800;margin-left:6px}
.item.on .starmark{color:#ffd84d}
.kids{flex:none;font-size:12px;border:1px solid currentColor;padding:0 6px;opacity:.75}

/* Lectura */
.card-bar{position:sticky;top:0;z-index:4;display:flex;gap:6px;align-items:center;
  padding:calc(4px + env(safe-area-inset-top)) 6px 4px;background:var(--face);
  border-top:1px solid var(--light);border-bottom:1px solid var(--shadow)}
.card-bar .grow{flex:1}
.bar-title{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-inner{padding:10px 8px 60px;max-width:920px;margin:0 auto}
.card-title{margin:2px 0 2px;font-size:20px;line-height:1.25;display:flex;gap:10px;align-items:center}
.card-title .mk{width:18px;height:18px}
.meta{color:var(--muted);font-size:12px;margin-bottom:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.paper{background:var(--panel);color:#000;border:2px solid;border-color:var(--sunken);padding:10px 12px;margin-top:6px}
#doc{display:block;font-size:calc(var(--fs) * 1px)}
.extra{margin-top:18px}
.extra h3{font-size:13px;margin:0 0 6px;padding-bottom:3px;border-bottom:1px solid var(--shadow);box-shadow:0 1px 0 #fff}
.links{display:flex;flex-direction:column;border:2px solid;border-color:var(--sunken);background:var(--field)}
.links a{display:flex;gap:8px;align-items:center;padding:7px 8px;text-decoration:none;border-bottom:1px solid var(--grid)}
.links a:last-child{border-bottom:0}
.links a:hover{background:var(--navy);color:#fff}
.cm{background:var(--field);border:2px solid;border-color:var(--sunken);padding:6px 8px;margin-bottom:6px}
.cm .anchor{color:var(--muted);font-size:12px;font-style:italic;margin-bottom:3px}
.cm .when{color:var(--muted);font-size:11px;margin-top:3px}
.parent{margin:2px 0}
.parent a{color:var(--navy)}
#empty{display:none;color:var(--muted);text-align:center;margin-top:30vh;padding:0 20px}

#banner{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--face);color:var(--text);padding:8px 12px;z-index:20;display:flex;gap:10px;align-items:center;
  border:2px solid;border-color:var(--raised);box-shadow:2px 2px 0 #000}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;overflow:auto;
  display:flex;align-items:center;justify-content:center}
#lightbox img{max-width:100%;max-height:100%;cursor:zoom-in;background:#fff}
#lightbox.full{display:block}
#lightbox.full img{max-width:none;max-height:none;cursor:zoom-out}
#lbclose{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:31;width:38px;height:38px;font-size:20px;padding:0}

/* Pantalla de clave: escritorio verde azulado y ventana de diálogo */
#lock{position:fixed;inset:0;background:#008080;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.lockbox{background:var(--face);border:2px solid;border-color:var(--raised);box-shadow:3px 3px 0 #000;
  width:100%;max-width:340px;display:grid;gap:10px;padding-bottom:14px}
.lockbox h2{margin:0;padding:4px 8px;font-size:14px;color:#fff;background:linear-gradient(90deg,#000080,#1084d0)}
.lockbox>*:not(h2){margin:0 14px}
.lockbox p{margin:0 14px}
.lockbox input{width:auto}
.lockbox .seg{min-height:30px;font-size:14px;font-weight:700}
.lockbox .err{color:#b00020;min-height:1.2em;font-weight:700}
.msg{padding:30px 18px;text-align:center;color:var(--muted)}

/* Barras de desplazamiento con relieve (donde el navegador lo permite) */
::-webkit-scrollbar{width:16px;height:16px;background:#dcdcdc}
::-webkit-scrollbar-thumb{background:var(--face);border:2px solid;border-color:var(--raised)}
::-webkit-scrollbar-corner{background:#dcdcdc}

@media (min-width: 900px){
  html,body{overflow:hidden}
  #app{height:100vh}
  #side{width:400px;flex:none;border-right:1px solid var(--shadow);box-shadow:1px 0 0 #fff;overflow-y:auto}
  body.reading #side{display:flex}
  #main{display:block;overflow-y:auto}
  #empty{display:block}
  body.reading #empty{display:none}
  #back{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-head">
      <h1>Fichero95</h1>
      <span class="sub" id="sub"></span>
      <button class="icon" id="reload" title="Recargar datos" aria-label="Recargar datos">&#8635;</button>
      <button id="forget" title="Olvidar la clave en este dispositivo" hidden>Salir</button>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="Buscar en títulos, textos y etiquetas…" autocomplete="off">
      <select id="cat" aria-label="Materia"></select>
      <details class="tagbox" id="tagbox">
        <summary>Etiquetas <span id="tagsel"></span></summary>
        <div class="tagmode">Mostrar temas con:
          <button class="seg on" data-mode="any">cualquiera</button>
          <button class="seg" data-mode="all">todas</button>
        </div>
        <div class="chips" id="tags"></div>
      </details>
      <label class="chk"><input type="checkbox" id="onlystar"> Solo importantes ★</label>
    </div>
    <ul id="list"></ul>
  </aside>
  <main id="main">
    <div id="empty">Elegí un tema de la lista para leerlo.</div>
    <article id="card" hidden></article>
  </main>
</div>
<div id="lock" hidden>
  <div class="lockbox">
    <h2>Fichero95</h2>
    <p>Esta copia está protegida. Ingresá tu clave.</p>
    <input id="lockpw" type="password" placeholder="Clave" autocomplete="current-password">
    <label class="chk"><input type="checkbox" id="remember" checked> Recordar este dispositivo</label>
    <button id="lockgo" class="seg">Abrir</button>
    <p id="lockerr" class="err"></p>
  </div>
</div>
<div id="banner" hidden><span>La app tiene cambios nuevos.</span><button id="refresh">Actualizar</button></div>
<div id="lightbox" hidden><button id="lbclose" aria-label="Cerrar">&times;</button><img alt=""></div>
<noscript><p class="msg">Esta página necesita JavaScript.</p></noscript>

(() => {
"use strict";
let STATIC = window.__F95__;
const ENC = window.__F95_ENC__;
const $ = s => document.querySelector(s);
const HEX = /^#[0-9a-f]{6}$/i;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

let IDX = null, TAGS = {}, current = 0, listScroll = 0, navigated = false;
let deviceNote = "";
const cardCache = new Map();
const state = { q: "", cat: "", tags: new Set(), mode: "any", star: false };

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status === 401 ? "Clave incorrecta" : "Error " + r.status);
  return r.json();
}
async function getCard(id) {
  if (STATIC) return STATIC.cards[id];
  if (cardCache.has(id)) return cardCache.get(id);
  const c = await getJSON("api/card/" + id);
  cardCache.set(id, c);
  return c;
}

function setIndex(idx) {
  IDX = idx;
  TAGS = {};
  idx.tags.forEach(t => TAGS[t.id] = t);
  idx.cards.forEach(c => {
    c._hay = norm([c.title, c.plain, c.group, c.tags.map(i => TAGS[i] ? TAGS[i].name : "").join(" ")].join(" "));
  });
}

async function loadAll() {
  setIndex(STATIC ? STATIC.index : await getJSON("api/index"));
  cardCache.clear();
  $("#sub").textContent = STATIC ? "Copia del " + IDX.generated + deviceNote : IDX.cards.length + " temas";
  $("#sub").title = deviceNote.includes("NO") ? "El navegador no permitió guardar la clave en este dispositivo (modo privado, cookies/almacenamiento bloqueado o navegador integrado de otra app)." : "";
  if (STATIC) $("#reload").hidden = true;
  if (state.cat && !IDX.categories.some(c => c.name === state.cat)) state.cat = "";
  renderFilters();
  renderList();
}

/* ---------- Marcadores y colores ---------- */
function marker(c) {
  const ok = HEX.test(c.color || "");
  return `<span class="mk${c.shape === "circle" ? " circle" : ""}${ok ? "" : " nocolor"}"` +
         (ok ? ` style="background:${c.color}"` : "") + `></span>`;
}
function rowStyle(c) {
  if (!HEX.test(c.bg || "")) return "";
  const r = parseInt(c.bg.slice(1, 3), 16), g = parseInt(c.bg.slice(3, 5), 16), b = parseInt(c.bg.slice(5, 7), 16);
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  return `background:${c.bg};color:${lum > 150 ? "#202020" : "#ffffff"}`;
}
const pill = t => `<span class="pill" style="background:${esc(t.bg)};color:${esc(t.fg)}">#${esc(t.name)}</span>`;

/* ---------- Filtros ---------- */
function renderFilters() {
  const total = IDX.cards.length;
  $("#cat").innerHTML = `<option value="">Todas las materias (${total})</option>` +
    IDX.categories.map(c => `<option value="${esc(c.name)}"${c.name === state.cat ? " selected" : ""}>${esc(c.name)} (${c.count})</option>`).join("");
  $("#tags").innerHTML = IDX.tags.length
    ? IDX.tags.map(t => `<button class="chip pill${state.tags.has(t.id) ? " on" : ""}" data-tag="${t.id}" style="background:${esc(t.bg)};color:${esc(t.fg)}">#${esc(t.name)} <small>${t.count}</small></button>`).join("")
    : `<span class="msg" style="padding:6px">No hay etiquetas.</span>`;
  $("#tagsel").textContent = state.tags.size ? "(" + state.tags.size + ")" : "";
  document.querySelectorAll(".seg").forEach(b => b.classList.toggle("on", b.dataset.mode === state.mode));
}

function effPin(c) {
  if (c.pin === 2) return 2;
  if (c.pin === 1 && state.cat) return 1;
  return 0;
}

function visible() {
  const words = norm(state.q).replace(/^#/, "").split(/\s+/).filter(Boolean);
  const filtering = words.length > 0 || state.tags.size > 0 || state.star;
  let rows = IDX.cards.filter(c => {
    if (state.cat && c.group !== state.cat) return false;
    if (state.star && !c.starred) return false;
    if (state.tags.size) {
      const has = [...state.tags].map(t => c.tags.includes(t));
      if (state.mode === "all" ? !has.every(Boolean) : !has.some(Boolean)) return false;
    }
    return words.every(w => c._hay.includes(w));
  });
  // Igual que la app: los subtemas solo se listan al buscar o filtrar.
  if (!filtering) rows = rows.filter(c => !c.parent);
  rows = rows.map((c, i) => [c, i]).sort((a, b) => effPin(b[0]) - effPin(a[0]) || a[1] - b[1]).map(x => x[0]);
  return { rows, filtering };
}

function renderList() {
  const { rows, filtering } = visible();
  const list = $("#list");
  if (!rows.length) {
    list.innerHTML = `<li class="none">${IDX.cards.length ? "Ningún tema coincide con la búsqueda." : "Todavía no hay temas en la app."}</li>`;
    return;
  }
  list.innerHTML = rows.map(c => {
    const tags = c.tags.map(i => TAGS[i]).filter(Boolean).map(pill).join("");
    const meta = (state.cat ? "" : `<span>${esc(c.group)}</span>`) + tags;
    return `<li><a class="item${c.id === current ? " on" : ""}" href="#/card/${c.id}" style="${rowStyle(c)}">` +
      marker(c) +
      `<span class="it-main"><span class="it-title${c.starred ? " star" : ""}">${filtering && c.parent ? "↳ " : ""}${esc(c.title || "(sin título)")}` +
      (c.starred ? `<span class="starmark" title="Importante">★</span>` : "") +
      (c.pin ? `<span class="pin${c.pin === 2 ? " p2" : ""}" title="${c.pin === 2 ? "Anclado arriba de todo" : "Anclado en su materia"}"></span>` : "") +
      `</span>${meta ? `<span class="it-meta">${meta}</span>` : ""}</span>` +
      (c.kids ? `<span class="kids" title="Subtemas">${c.kids}</span>` : "") +
      `</a></li>`;
  }).join("");
}

/* ---------- Lectura de un tema ---------- */
const BASE_CSS = `
:host{display:block}
.doc{overflow-wrap:anywhere;line-height:1.5}
.doc img{max-width:100%;height:auto;cursor:zoom-in}
.doc table{max-width:100%}
.doc a{color:#1a47b8}
.doc .missing{color:#b03030;font-style:italic}
.doc p,.doc li{white-space:pre-wrap}
.doc ul,.doc ol{padding-left:1.6em}
`;
function fontSize() {
  let v = 16;
  try { v = parseInt(localStorage.getItem("f95fs") || "16", 10) || 16; } catch (e) {}
  return Math.min(28, Math.max(12, v));
}
function setFont(v) {
  document.documentElement.style.setProperty("--fs", v);
  try { localStorage.setItem("f95fs", String(v)); } catch (e) {}
}

async function showCard(id) {
  const box = $("#card");
  let c;
  try { c = await getCard(id); }
  catch (e) {
    box.hidden = false;
    box.innerHTML = `<div class="card-bar"><button class="icon" id="back">←  Temas</button></div><p class="msg">No se pudo abrir el tema (${esc(e.message)}).</p>`;
    document.body.classList.add("reading");
    return;
  }
  if (!c) { location.hash = "#/"; return; }
  if (id !== current && !document.body.classList.contains("reading")) listScroll = window.scrollY;
  current = id;
  const tags = c.tags.map(i => TAGS[i]).filter(Boolean).map(pill).join("") || `<span class="pill none">Sin catalogar</span>`;
  const links = arr => `<div class="links">${arr.map(x => `<a href="#/card/${x.id}">${x.color !== undefined ? marker(x) : ""}<span>${esc(x.title || "(sin título)")}</span></a>`).join("")}</div>`;
  const short = s => s.length > 140 ? s.slice(0, 140) + "…" : s;
  box.hidden = false;
  box.innerHTML =
    `<div class="card-bar"><button class="icon" id="back">←  Temas</button><span class="bar-title">${esc(c.group)}</span><span class="grow"></span>` +
    `<button class="icon" id="fsm" aria-label="Texto más chico">A−</button><button class="icon" id="fsp" aria-label="Texto más grande">A+</button></div>` +
    `<div class="card-inner"><h2 class="card-title">${HEX.test(c.color || "") ? marker(c) : ""}<span>${esc(c.title || "(sin título)")}</span></h2>` +
    `<div class="meta">${esc(c.group)} · ${esc(c.updated)}</div>` +
    (c.parent ? `<div class="parent meta">↳ Subtema de <a href="#/card/${c.parent.id}">${esc(c.parent.title)}</a></div>` : "") +
    `<div class="tags">${tags}</div><div class="paper"><div id="doc"></div></div>` +
    (c.subtopics.length ? `<section class="extra"><h3>Subtemas (${c.subtopics.length})</h3>${links(c.subtopics)}</section>` : "") +
    (c.backlinks.length ? `<section class="extra"><h3>Enlazado desde (${c.backlinks.length})</h3>${links(c.backlinks)}</section>` : "") +
    (c.comments.length ? `<section class="extra"><h3>Comentarios (${c.comments.length})</h3>` +
      c.comments.map(m => `<div class="cm">${m.anchor ? `<div class="anchor">«${esc(short(m.anchor))}»</div>` : ""}<div>${esc(m.body).replace(/\n/g, "<br>")}</div><div class="when">${esc(m.updated || m.created)}</div></div>`).join("") +
      `</section>` : "") + `</div>`;

  const host = $("#doc");
  const root = host.attachShadow({ mode: "open" });
  root.innerHTML = `<style>${BASE_CSS}${c.css}</style><div class="doc">${c.body}</div>`;
  root.querySelectorAll("a[href]").forEach(a => {
    if (!a.dataset.card) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  });
  root.querySelectorAll("table").forEach(t => {
    if (t.parentElement && t.parentElement.closest("table")) return;
    const w = document.createElement("div");
    w.style.overflowX = "auto";
    t.replaceWith(w);
    w.appendChild(t);
  });
  root.addEventListener("click", e => {
    const img = e.target.closest && e.target.closest("img");
    if (img) { openLightbox(img.src); return; }
    const a = e.target.closest && e.target.closest("a[data-card]");
    if (a) { e.preventDefault(); location.hash = "#/card/" + a.dataset.card; }
  });

  document.title = (c.title || "Tema") + " · Fichero95";
  document.body.classList.add("reading");
  $("#empty").style.display = "none";
  window.scrollTo(0, 0);
  $("#main").scrollTop = 0;
  document.querySelectorAll(".item").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#/card/" + id));
}

function showList() {
  current = 0;
  document.title = "Fichero95";
  $("#card").hidden = true;
  $("#card").innerHTML = "";
  $("#empty").style.display = "";
  document.body.classList.remove("reading");
  document.querySelectorAll(".item.on").forEach(a => a.classList.remove("on"));
  window.scrollTo(0, listScroll);
}

function route() {
  const m = location.hash.match(/^#\/card\/(\d+)$/);
  if (m) showCard(parseInt(m[1], 10)); else showList();
}

/* ---------- Imagen ampliada ---------- */
function openLightbox(src) {
  const lb = $("#lightbox");
  lb.classList.remove("full");
  lb.querySelector("img").src = src;
  lb.hidden = false;
}
$("#lightbox").addEventListener("click", e => {
  const lb = $("#lightbox");
  if (e.target.tagName === "IMG") lb.classList.toggle("full");
  else { lb.hidden = true; lb.querySelector("img").removeAttribute("src"); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#lightbox").click(); });

/* ---------- Eventos ---------- */
let timer = 0;
$("#q").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value; renderList(); }, 120);
});
$("#cat").addEventListener("change", e => { state.cat = e.target.value; renderList(); });
$("#onlystar").addEventListener("change", e => { state.star = e.target.checked; renderList(); });
$("#tagbox").addEventListener("click", e => {
  const chip = e.target.closest(".chip"), seg = e.target.closest(".seg");
  if (chip) {
    const id = parseInt(chip.dataset.tag, 10);
    state.tags.has(id) ? state.tags.delete(id) : state.tags.add(id);
  } else if (seg) state.mode = seg.dataset.mode;
  else return;
  renderFilters(); renderList();
});
$("#card").addEventListener("click", e => {
  if (e.target.closest("#back")) { location.hash = "#/"; }
  else if (e.target.closest("#fsm")) setFont(Math.max(12, fontSize() - 2));
  else if (e.target.closest("#fsp")) setFont(Math.min(28, fontSize() + 2));
});
window.addEventListener("hashchange", () => { navigated = true; route(); });

async function reloadData() {
  $("#banner").hidden = true;
  try {
    await loadAll();
    if (current) showCard(current);
  } catch (e) { $("#list").innerHTML = `<li class="none">${esc(e.message)}</li>`; }
}
$("#reload").addEventListener("click", reloadData);
$("#refresh").addEventListener("click", reloadData);

if (!STATIC && !ENC) {
  setInterval(async () => {
    if (document.hidden || !IDX) return;
    try {
      const v = (await getJSON("api/version")).version;
      if (v !== IDX.version) $("#banner").hidden = false;
    } catch (e) {}
  }, 15000);
}

function boot() {
  setFont(fontSize());
  loadAll().then(route).catch(e => {
    $("#list").innerHTML = `<li class="none">No se pudo cargar: ${esc(e.message)}</li>`;
  });
}

/* ---------- Copia cifrada: se descifra en el navegador, la clave nunca sale del equipo ---------- */
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = buf => { let s = ""; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const STORE = "f95_device_key";

function needCrypto() {
  if (!window.crypto || !crypto.subtle) throw new Error("Este navegador no puede descifrar desde aquí (hace falta HTTPS).");
}
async function deriveKey(pw) {
  needCrypto();
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: unb64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decryptWith(key) {
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(ENC.iv) }, key, unb64(ENC.ct)); }
  catch (e) { throw new Error("Clave incorrecta"); }
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
function loadSaved() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE) || "null");
    return v && v.salt === ENC.salt ? v : null;
  } catch (e) { return null; }
}
function clearSaved() { try { localStorage.removeItem(STORE); } catch (e) {} }
function finishUnlock() {
  $("#lock").hidden = true;
  $("#forget").hidden = false;
  boot();
}
async function rememberDevice(key) {
  try {
    localStorage.setItem(STORE, JSON.stringify({ salt: ENC.salt, key: tob64(await crypto.subtle.exportKey("raw", key)) }));
    if (!loadSaved()) throw new Error("no persistió");   // comprobar que realmente quedó guardado
    deviceNote = " · recordado";
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  } catch (e) {
    deviceNote = " · NO recordado";
  }
}
async function unlock() {
  const err = $("#lockerr"), btn = $("#lockgo");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Abriendo…";
  try {
    const key = await deriveKey($("#lockpw").value);
    STATIC = await decryptWith(key);
    if ($("#remember").checked) await rememberDevice(key);
    finishUnlock();
  } catch (e) { err.textContent = e.message; }
  btn.disabled = false; btn.textContent = "Abrir";
}

if (ENC) {
  $("#sub").textContent = "Protegido";
  $("#lockgo").addEventListener("click", unlock);
  $("#lockpw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
  $("#forget").addEventListener("click", () => { clearSaved(); location.reload(); });
  (async () => {
    const saved = loadSaved();
    if (saved) {  // este dispositivo ya había ingresado la clave correcta
      try {
        needCrypto();
        const key = await crypto.subtle.importKey("raw", unb64(saved.key), "AES-GCM", false, ["decrypt"]);
        STATIC = await decryptWith(key);
        deviceNote = " · recordado";
        finishUnlock();
        return;
      } catch (e) { clearSaved(); }  // clave cambiada o dato inválido: se vuelve a pedir
    }
    $("#lock").hidden = false;
  })();
} else boot();
})();
</script>
